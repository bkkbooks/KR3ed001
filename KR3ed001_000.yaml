body:
  text: 諸傷膏甘草各二桂疆薑椒一毀一垸咅杯酒中飲之日一飲以其二一朐令大如答即以赤答一斗並復治三孰熟飲其汁汁宰滓皆索食之自次恣解痛斬四一治齊淳酒漬而餅之煏瓦鬵炭漬五煏之如即治入三指最撮半咅杯溫酒者六百治大者八十小者册治精七一燔白雞毛及人發治各等百草末八灰治而一垸溫酒一咅杯中八飲之九一以刃傷類燔羊矢敷之一一止血出者燔發以安按其痏一一一令傷者毋痛毋血出取故蒲席厭燔痏一二一傷者血出祝曰男子竭女子酨五畫地之一三一令傷毋般瘢取彘膏衍並治敷之一四一以男子洎敷之皆不般瘢一五一金傷者以方肪膏烏豙喙皆相煎釶施之一六一傷者以續繼斷根一把獨長支枝者二廷梃黃僉今芩二梃甘草廷梃秋烏豙喙二一七者二甌即並煎孰熟以布捉取出其汁以陳縕敷之一八一者治黃黔芩與彘膏之即以布捉取一九浘之二一久傷者薺齏杏木再核核中人仁以職肢膏辨封痏蟲即出嘗試二一一稍消石直置溫湯中以灑癰二二一令金傷毋痛方取蚡鼠干而治取彘魚燔而治薪辛夷甘草各與蚡二三鼠等皆合撓取三指最撮一入溫酒一咅杯中而飲之不可財益藥至不癰而止令二四一令金傷毋痛取薺孰熟干實火囂熬令焦黑治一木朮術根去皮治二凡二物並和取三二五指最撮到節一醇酒盈一衷杯杯入藥中撓飲不者灑半杯杯已飲有頃不痛二六復痛飲藥如數不痛毋飲藥藥先食後食次恣治病時毋食魚彘肉馬肉龜二七蟲葷麻洙採菜毋近內病已如故治病毋時一治藥足治病藥已治裹以二八繒臧藏治木朮術暴曝若有所燥治令二九傷痙痙者傷風入傷身信伸而不能詘屈治之火囂熬鹽令黃取一斗裹以布卒淬醇酒中入三即出蔽以布以尉頭熬則舉適下為裹更尉尉寒更火囂熬鹽以尉尉勿三一絶一尉寒汗出汗出多能詘屈信伸止尉時及已尉四日內衣毋見風過四日自三二適尉先食後食次恣毋禁毋時令三三一傷而頸痙者以水財煮李實疾沸而抒浚取其汁寒和以飲病者飲以三四故節即其病甚弗能飲者強啓其口為灌之節即毋李實時三五煮炊飲其汁如其實數毋禁嘗試令三六一諸傷風入傷傷癰痛治以枲絮為獨傷漬彘膏煎汁三七沃數注下膏勿絶以歐驅寒氣舉以敷傷空孔𦿝蔽三八休得為癰三九敷藥先食後食次恣毋禁毋時礜不盡四一傷而頸痙者小𠟃一犬漰與薛糱半鬥毋去其足以並盛漬井蜜四一出之陰乾百日即有頸痙者治以三指一撮和以溫酒一咅杯飲之四二一傷脛痙者擇薤一把以敦淳酒半鬥者煮沸沸飲之即溫衣陝夾坐四旁汗出到足乃四三一治黃黔芩甘草相半即以彘膏財足以煎之煎之沸沸即以布足捉之豫抒其汁敷四四嬰兒索痙索痙者如産時居濕地久其网月肯直而口扣筋龻土攣難以信伸取封殖土治之四五二鹽一合撓而蒸蒸以扁遍尉直网月肯攣筋所道頭始稍手足而已尉寒四六復蒸蒸尉乾更為令四七嬰兒病間癇方取雷尾癤矢三果顆治以豬煎膏和之小嬰兒以水半鬥大者以一斗三分和取四八一分置水中撓以浴之浴之道頭上始下盡身四支肢毋濡三日一浴三日已已浴輒棄其四九水圂中間癇者身熱而數驚頸脊強而復腹大間癇多衆以此藥皆已五嬰兒瘛嬰兒瘛者目繲𢖷然脅痛息癭嚶癭嚶然癤矢不化而青取屋榮蔡薪燔之而五一匕焉為湮汲三渾盛以杯杯因唾匕祝之曰噴者居劇噴上五二如哲彗星下如燡衃血取若門左斬若門右為若不已磔薄膊若市因以匕周抿五三嬰兒瘛所而灑之杯杯水中候之有血如蠅羽者而棄之於垣更取水五四復唾匕馤漿以抿如前毋徵數復之徵盡而止令五五狂犬齧人取恆石兩以相靡磨殹也取其靡磨如麋糜者以敷犬所齧者已矣五六一狂犬齧人者孰澡操湮汲注杯杯中小少多如再食浮漿取灶末灰三指最撮五七水中以飲病者已飲令孰奮兩手如間手道五八狂犬齧者莫敷五九一狂犬傷人治礜與橐莫醯半咅杯飲之女子同藥如六犬筮噬人傷者取丘蚯引蚓矢二升以井上甕斷處土與等並熬之而以美醯六一之稍垸以尉其傷犬毛盡敷傷而已六二一煮莖以汁灑之冬日煮其本六三一犬所齧令毋痛及易瘳方令齧者臥而令人以酒財沃其傷已沃而六四越之嘗試毋禁六五巢者侯候天甸電而兩手相靡摩鄉向甸電祝之曰東方之王西方主冥冥人星二七而六六一取牛㮨烏豙喙桂治等淆熏以病六七夕下以黃枔芩黃枔芩長三寸合盧大如豆卅去皮而並治摀搗而煮之令六八沸而溍去其宰滓即以汁淒夕下已乃以脂所治藥敷六九之節即復欲敷之淒敷之如前已夕下靡七毒烏豙喙者炙飲小童弱溺若産齊赤而以水飲七一一屑勺芍藥以半杯杯以三指大捽撮飲之七二一取杞本長尺大如指削春正舂木臼中煮以酒七三一以汁粲叔菽若苦已七四一煮鐵飲之七五一禺遇人毒者取麋蘼蕪本若薺一敷宥痏七六一穿地尺而煮水一甕一咅杯七七㯆癘蠆以財蕳薤七八一七九一濡以鹽敷之令牛吔舐之八一以疾蒺黎藜白蒿封之八一一唾唾之賁噴兄父産大山而居谷下不而而鳳鳥八二尋尋豙且貫而心八三一父居蜀母為鳳鳥蓐毋敢上下尋鳳貫而心八四蛭食蝕人胻股膝産其中者並黍叔菽秫術三炊之蒸蒸病八五一榖文凵非蛫敷之八六蚖榖文凵非蘭以酒沃飲其汁以宰滓封其痏數更之以熏八七一以葪印其中顛八八一以産豚豙豶麻磨之八九一以堇一陽築築封之即燔鹿角以弱溺飲之九一吙𧪘嗟年鵺殺人今茲有又復之九一一以青梁米為鬻粥水十五而米一成鬻粥五斗出揚去氣盛以新瓦甕冥冪口以布三九二即封塗塗厚二寸燔令泥盡火而啜啜之痏己九三一亨烹三宿雄雞二洎水三斗孰熟而出及汁更洎以食逆甗下炊五㝅榖兔九四肉陀他甗中稍沃以汁令下盂中孰熟飲汁九五一賁噴吙伏食父居北在母居南止同産三夫為人不德已不已青敷之九六一湮汲一咅杯入奚蠡中左承之北鄉向鄉向人禹步三問其名即曰某某年今九七飲半咅杯曰病己徐去徐已即復覆奚蠡去之九八一煮鹿肉若野彘肉食之啜啜汁精九九一燔貍皮治灰入酒中飲之多可殹也不傷人煮羊肉以汁之一取井中泥以還環封其傷已一一尤疣取敝蒲席若藉之弱蒻繩之即燔其末以久灸尤疣末熱即拔尤疣去之一二一令尤疣者抱禾令人呼呼曰若胡為是應曰吾尤疣置去禾勿顧一三一以月晦日之丘井有水者以敝帚騷掃尤疣二七祝曰今日月晦騷掃尤疣北入帚井中一四一以月晦日日下餔時取由塊大如雞卵者男子七女子二七先以由塊置室後令南北列一五以晦往之由塊所禹步三道南方始取由塊言曰由言曰今日月晦靡磨尤疣北由塊一靡磨一六已靡磨置由塊其處去勿顧靡磨大者一七一以月晦日之內後曰今日晦弱搦又疣內北靡磨又疣內闢壁二七一八一以朔日葵莖靡磨又疣二七言曰今日朔靡磨又疣以葵戟有又以殺本若道旁㡐葥根二七投一九澤若淵下除日已望一一一祝尤疣以月晦日之室北靡磨宥疣男子七女子二七曰今日月晦靡磨宥疣室北不出一月宥疣已一一一顛癲疾先侍偫白雞犬矢發即以刀剶劙其頭從顛到項即以犬矢濕之而中剶劙雞一一二冒其所以犬矢濕者三日而已已即孰熟所冒雞而食之已一一三一癲癲疾者取犬尾及禾在圈垣上者段治湮汲以飲之一一四白處方取灌青其一名灌曾取如鹽草分鬥一灶黃土十分升一皆治而一一五指而先食飲之不已有又復之而灌青再飲而已令一一六一其與其真治之以鳥卵勿毀半鬥甘鹽一一七者其中卵次之以一一八冥冪甕以布四三一一九蔡已塗之即縣懸陰燥一二厚蔽肉扁遍施所而止之於熱弗能支而止而止施一二一雖俞愈而毋去其藥藥而自殹也已炙之之時食甚一二二搜及毋手敷之以旦未食敷藥已敷藥即飲善酒極厭而止即炙已炙一二三之而起欲食即食出入飲食自次恣旦服藥先毋食二三日服藥時毋食一二四魚病已如故治病毋時二三月十五日到十七日取鳥卵已即用之一二五鳥殹也其卵雖有人仁猶可用殹也此藥已成居雖十余歲到歲俞逾良一二六而干不可以塗身少取藥足以塗施者以美醯之於瓦缶扁中漬之一二七可河和稍如恆煮膠即置其缶扁於硇火上令藥已成而發之發之塗一二八冥冪以布蓋以缶扁縣懸之陰燥所十歲以前藥乃干一二九一白倪白倪者白毋奏腠取丹沙與鱣魚血若以雞血皆可雞湮居二之一三以蚤挈契䐈令赤以之二日灑以新布孰暨溉之復敷如此數卅日而止令一三一大帶者燔虀與久膏而敷之一三二一以清煮膠以塗塗之一三三冥螟病方冥螟者蟲所齧穿者其所發毋恆處或在鼻或在口旁或齒齦或在手指一三四使人鼻抉缺指斷治之以鮮産魚而以鹽財和之以敷蟲所齧一三五之病已止嘗試毋禁令一三六蠸者以蠸一入卵中之一三七入一三八兔皮一三九一榖文凵非蘭一四一以淳酒一四一一以湯沃一四二𢵡取蘭一四三一炙䰡𢵡一四四人病馬不間癇者以浴病者病者女子一四五男子即以女子初有布一四六燔一四七飲以布一四八酒中飲一四九干蔥一五鹽隋脽炙尻一五一一䗱華以封隋脽及少腹一五二一治虻蓂少半升陳葵種一而一五三一湮汲水三斗以龍鬚須一束並者煮一五四一久灸左足中指一五五一三湮汲取杯杯水噴噴鼓三曰上有鋭某一五六飲之而復覆其杯杯一五七一及癟不出者方以醇酒入煮膠廣燔段煅一五八火而焠酒中沸盡而去之以酒飲病者飲之令一五九起自次恣殹也不已有又復如此數令一六一𠺕痛於脬及衷痛甚弱溺痛益甚治之黑叔菽三升以美醯三一六一煮疾炊沸沸止火沸沸下復炊參三沸沸止浚取汁牡厲蠣一毒堇治三凡二物一六二取三指最撮到節一醯寒溫適入中飲飲先食後食次恣一飲病俞愈日一飲一六三三日病已病已類石如泔從前出毋禁毋時治厲蠣毒堇不暴曝以夏日至到一六四毒堇陰乾取葉實並治裹以韋臧藏用取之歲更取毒堇毒堇一六五堇葉異小赤莖葉從縱纗者葉實味苦前日至可六七日䅎秀一六六澤旁令一六七一以水一斗煮葵種一斗浚取其汁以其汁煮膠一廷梃半為汁一參而一六八一贛戎鹽若美鹽盈隋脽有又以塗塗隋脽下及其上而暴曝若一六九一亨烹葵而飲其汁冬本沃以一七一亨烹葵熱啜啜其汁即隸以多為故而尻厥一七一一以酒一咅杯漬襦頸及頭垢中令沸而飲之一七二一𠺕弱溺不利脬盈者方取棗種粗粗屑二升葵種一升合撓三分之以水一斗半煮一一七三分孰熟去滓有又煮一分如此以盡三分浚取其汁以蜜蜜和令毚才甘寒溫適一七四飲之藥盡更為病已而止令一七五一𠺕取景天長尺大圍束一分以為三以淳酒半鬥三皯煮之孰熟浚取其汁啜啜一七六之不已復之不過三飲而已先莫暮毋食旦飲藥令一七七一𠺕坎方尺有半深至肘即燒陳稿其中令其灰不盈半尺薄灑之以美酒一七八莤莢一棗十四豙藙之朱茱臾萸椒合而一區燔之坎中以隧下已沃一七九一𠺕燔陳芻若陳薪令病者北背火炙之兩人為靡磨其尻𠺕已一八一以水一斗煮膠一參米一升孰熟而啜之夕毋食一八一一取螺牛二七薤一拼亠口廠某一𧘇並以酒煮而飲之一八二一以己巳晨睘寢東鄉向弱溺之不已復之一八三一血𠺕煮荊三溫之而飲之一八四一石𠺕三溫煮石葦若酒而飲之一八五一膏𠺕澡石大若李口賴已食飲之不已復之一八六一女子𠺕取三歲陳霍藿取其汁而飲之一八七一女子𠺕煮隱夫術飲之居一日榖文凵非陽羹之一八八一以醯酉酒三乃皯煮黍稷而飲其汁皆一八九一以衣中衽紝緇繢約左手大指一三日一九弱溺淪者方取其先取鵲棠下蒿一九一膏弱溺是胃謂內復以水與弱溺煮陳葵種而飲之有又榖文凵非陽而羹之一九二種腫橐種腫橐者黑實橐不去治之取馬矢粗者三斗孰析沃以水水清止浚去汁洎以酸漿一九三鬥取芥衷夾一用智知四五用種腫去毋禁毋時令一九四頽㿗操柏杵禹步三曰賁者一襄胡濆者二襄胡濆者三襄胡柏杵臼穿一母一一九五獨有三賁者種腫若以柏杵七令某豇㿗毋一必令同族抱頽㿗者直置東鄉向窗道外一九六攺椎之一九七一令斬足者清明東鄉向以筒豆萑萑又之二七一九八一𠺕以月十六日始毀禹步三曰月與日相當日與月相當各三父乖母強等與人産子獨一九九産頽㿗尢乖已操葭鍛石墼擊而母即以鐵椎攺段之二七以日出為之令頽㿗者東鄉向二一漬女子布以汁亨烹肉食之啜啜其汁二一一破卵咅杯醯中飲之二二一炙蠶卵令簍簍黃治之三指最撮至節入半咅杯酒中飲之三四日二三一以辛巳日古辜曰賁辛巳日三曰天神下干疾神女倚序聽神吾語某狐叉非其處所已不二四已斧斬若即操布攺之二七二五一以日出時今頽㿗者屋霤下東鄉向令人操築西鄉向祝曰今日某頽㿗尢今日已某頽㿗已二六而父與母皆盡柏築之顛父而沖子胡不已之有以築沖頽㿗二七已備即曰某起頽㿗已二七一辛卯日立堂下東鄉向鄉向日令人挾提頽㿗者曰今日辛卯更名曰禹二八一取枲垢以艾裹以久灸頽㿗者中顛令闌爛而已二九一令頽㿗者北首臥北鄉向廡中禹步三步呼呼曰籲狐麃三若智知某病狐二一一葌㿗及癭取死者叕蒸蒸之而新布裹以囊前行二一一一陰乾之旁逢卵以布裹二一二一頽㿗者及股癰鼠復腹者中指蚤搔二七必瘳二一三一以稈為弓以甗衣為弦以葛為矢以羽旦而射莫暮而小二一四一以冥蠶種方尺食衣白魚一七長足二七熬蠶種令黃靡磨取蠶種治亦靡磨白魚長二一五足節三並以醯二升和以先食飲之嬰以一升二一六一穿小瓠壺今其空孔盡容頽㿗者腎與𤶑即今頽㿗者煩誇瓠東鄉向坐於東陳垣下即內納腎二一七𤶑於壺空孔中而以採為四寸杙二七即以採木椎窡剟之一再靡磨之已窡剟輒椄二一八杙垣下以盡二七杙而已為之恆以入月旬六日盡日一為再為之為之恆以星出時二一九為之須頽㿗已而止二二一葌㿗先上卵引下其皮以砭砭穿其隋脽旁汁及膏撓以醇有又久灸其痏勿令風二二一及易瘳而久灸其泰太陰泰太陽令二二二一治頽㿗初發傴攣而未大者方取全蟲蛻一皆燔酒飲財二二三足以醉男女皆可令二二四一頽㿗以奎蠡蓋其堅腎即取桃支枝東鄉向者以為弧取母上晦一二二五射以三矢飲樂藥其藥曰陰乾黃牛膽干即稍飲之二二六一治囷菌桂尺獨一升並治而盛竹甬筒中盈筒二二七即蓂冪以布而敷之隋脽下為二處即道其二二八之炊者必順其身須其身安定二二九頽㿗己敬以豚塞以為不仁以白二三縣懸茅比所且塞壽禱以為二三一一取女子月事布漬炙之令溫二三二四榮燔量簧治桂五寸二三三上二三四頽㿗久灸左胻二三五一夕毋食旦取豐蜂卵一漬美醯一杯杯以飲之二三六脈者取野獸肉食者五物之毛等燔治合撓誨每旦先食取三指大撮三以溫酒一杯和飲之到二三七莫暮有又先食飲如前數恆服藥草日雖久病必服藥時禁毋食彘肉鮮魚嘗試二三八牡痔有螺肉出或如鼠乳狀末大本小有空孔其中之疾久灸熱把其本小者而䗿䗿絶之取二三九內戶旁祠空中黍腏燔死人頭皆治以修膏濡而入之其空孔中二四一多空孔者亨烹肥羭取其汁𤶱漬美黍米三斗炊之有又以修滫之孰熟分以為二以各二四一一分即取瘰𠺗末菽醬之宰滓半並春正舂以敷痔空孔厚如韭葉即以厚布裹更溫二四二二日而已二四三一牡痔居竅旁大者如棗小者如棗核核者方以小角角之如孰熟二斗米頃而張角潔以小二四四繩剖以刀其中有如兔𡃤若有堅血如抇末而出者即已令二四五一牡痔之居竅㿌廉大如棗核核時養癢時痛者方先剶劙之弗能剶劙龜𩝐腦與地膽蟲相二四六半和以敷之燔小隋橢石淬醯中以尉不已有又復之如此數令二四七牝痔之入竅中寸狀類牛幾三然後而潰出血不後上鄉向者方取弱溺五斗以煮青蒿二四八大把二鮒魚如手者七治桂六寸干薑薑二果顆十沸抒置甕中貍埋席下為竅以熏二四九痔藥寒而休日三熏因咽敝飲藥將漿毋飲它為藥漿方取䓛莖幹治二升取二五亠者署苽蓏汁二斗以漬之以為漿飲之病已而已青蒿者荊名曰萩䓛者荊名曰盧茹二五一其葉可亨烹而酸其莖有刺刺令二五二一牝痔有空孔而欒血出者方取女子布燔置器中以熏痔三日而止令二五三一牝痔之有數竅蟯白徒道出者方先道導以滑夏鋌令血出穿地深尺半袤尺廣二五四三寸燔炭其中段煅駱阮少半鬥布炭上以布周蓋坐以熏下竅煙滅滅取肥二五五肉置火中時自啓竅燒節火滅滅以日一熏下而五六日清二五六駱阮一名日白苦苦浸二五七一痔者以醬灌黃雌雞令自死以菅裹塗塗上土炮之塗塗干食雞以羽熏纂二五八一治麋蘼蕪本方防風烏豙喙桂皆等漬以淳酒而垸之大如黑叔菽而吞之始食一不智知益一二五九為極有可以領傷恆先食食之二六一未有巢者煮一斗棗一斗膏以為四斗汁置般盤中而居踞之其蟲出二六一一巢塞直䐈者殺狗取其脬以穿籥入直䐈中炊吹之引出徐以刀剝劙去其巢治黃黔芩而婁屢敷二六二之人州出不可入者以膏膏出者而到倒縣懸其人以寒水戔濺其心腹入矣二六三血寺痔以弱溺孰熟煮一牡鼠以氣尉二六四朐養癢痔痔者其直䐈旁有小空孔空孔兌兌然出時從其空孔出有白蟲時從其空出其直䐈痛尋燖然類辛二六五狀治之以柳菌一捼艾二凡二物為穿地令廣深大如䀁燔所穿地令之干而置艾二六六其中置柳菌艾上而燔其艾菌而取䀁穿其斷令其大圓寸以復覆之以土雍壅二六七䀁會毋煙能裊泄即被䀁以衣而毋蓋其䀁空孔即令痔者居踞䀁令直䐈直值䀁二六八空孔令煙燻直䐈熏直䐈熱則舉之寒則下之圈倦而休二六九一取石大如卷拳二七孰熟燔之善伐米大半升水八米取石置中孰熟即啜啜之而已二七睢疽病治白蘞蘞黃蓍耆芍樂藥桂疆薑椒朱茱臾萸凡七物骨睢疽倍白簽蘞肉睢疽倍黃蓍耆腎睢疽二七一倍芍藥其餘各一並以三指大最撮一入杯杯酒中日五六飲之須已二七二一三皯煮逢蓬虆取汁四斗以灑睢疽癰二七三一睢疽始起取啇商牢漬醯中以尉其種腫處二七四一睢疽以白蘞黃耆耆芍藥甘草四物者煮疆薑蜀焦椒樹茱臾萸四物而當一物其一骨三二七五以酒一杯杯筋者倐倐翟翟之其日四飲一欲潰止二七六一者方以二七七鬥已灑睢疽二七八以羹二七九一睢疽未烏豙喙十四果顆以美醯半升澤釋泔二參入藥中二八令如灸手以靡磨敷之以余藥封而裹二八一不痛己令二八二一益嗌睢疽者白蘞三罷合一並治飲之二八三一爛疽爛疽者起而治以彘膏未湔煎者灸銷消以和敷之日一敷二八四樂藥敷樂藥前灑以溫水服藥卅日已嘗試令二八五一諸疽物初發者取大叔菽一斗熬孰熟即急抒置甑置其二八六醇酒一斗淳之即取其汁盡飲之一飲病未已二八七飲之可不過數飲病已毋禁嘗試令二八八一血睢疽始發榙倏榙倏以熱痛毋適睢疽二八九戴𣟳糝黃芩白蘞蘞皆居三日二九之令汗出到足已二九一一氣睢疽始發溳溳以𫾔如狀手廡撫靡摩而二九二二果顆令中而叔糵熬可以酒沃即浚二九三出而止二九四一睢疽發出禮體如人䝁之人攜之甚二九五半鬥煮成三升飲之溫衣臥二九六一喙二九七雖二九八一睢疽橿薑桂椒居四二九九淳酒半鬥煮令成三升三一三䝁亠口廠某一𧘇細切淳酒一斗三一即淙而之溫衣三二一桂椒三三一煮麥麥孰熟以汁灑之膏三四一灸梓葉溫之三五闌爛者方以人泥塗之以犬毛若羊毛封之不已復以三六一闌爛者爵嚼糵米足捉取汁而煎令類膠即治厚柎和敷三七一熱者古辜曰肸詘肸詘從灶出毋延黃神且與言即三唾唾之三八一煮秫米期足毚才孰熟浚而熬之令為灰敷之數日干以汁辨之三九一以雞卵辨兔毛敷之三一一治糵米以乳汁和敷之不痛不瘢三一一一燔魚衣以其灰敷之三一二一燔敝褐治布以敷之三一三一漬女子布以汁敷之三一四一蒸蒸箘土裹以尉之三一五一浴湯熱者熬彘矢漬以䂱醯封之三一六一以湯大熱者熬彘矢以酒拿封之三一七一般瘢者以水銀二男子惡四丹一並和置突上二三月盛成即囊而敷之敷之居室三一八塞窗閉戶毋出私內中毋見星月一月百日己三一九一去故般瘢善削瓜壯者而其瓣材其瓜其如兩指以靡磨般瘢令之以三二敷之干有又敷之三而己必善齊齋戒毋而己三二一一者靡磨以以汁敷産膚三二二一般瘢者燔之令灰以如故膚三二三一三二四一取秋竹者煮之而以氣熏其痏己三二五胻膫治胻膫取陳黍叔菽治以犬膽和以敷三二六一取無蕪夷荑中核核治獖膏以蛗熱膏沃治中和以敷三二七一取雉二孰熟者煮余疾雞羽自解隋墮其尾皆燔治取灰以豬膏和敷三二八一夏日取堇葉冬日取其本皆以甘口沮咀而封之干輒封其上此皆已驗三二九胻傷取久溺中泥善擇去其蔡沙石置泥器中旦以苦酒以泥敷傷敷三三之傷已己用三三一一胻久傷胻久傷者癰癰潰汁如靡糜治之煮水二鬥郁一參𦬸術一參一參凡三物郁𦬸術皆治三三二湯中即炊湯湯溫適可入足即置小木湯中即居入足湯中踐木滑三三三湯寒則炊之熱即止火自適殹也朝己食而入湯中到餔時出休病即俞愈矣病不三三四者一入湯中即瘳其甚者五六入湯中而瘳其瘳殹也癰癰而新肉産肉産即毋入湯三三五中矣即自合而瘳矣服藥時毋禁及治病毋時令三三六加痂以少小嬰兒弱溺漬羖羊矢卒其時以敷之三三七一治雄黃以彘膏修滫少淆以醯令其溫適以敷之敷之毋濯先孰灑加痂以湯乃敷三三八一治僕纍以攻釭脂膳而敷敷炙之三四敷三三九一刑赤蜴以血塗塗之三四一治亭葶磿藶莁夷荑熬叔菽皆等以牡膏鱣血膳先以酒灑燔朴炙之乃敷三四一一治牛膝燔髶灰等並孰灑加痂而敷之炙牛肉以久脂塗塗其上雖已復敷三四二勿擇釋三四三一以脂若豹膏而炙之而不痛婁屢復之先飲美酒令身溫乃三四四一善灑靡磨之血以水銀敷有又以金䈽𠺗治末皆等以彘膏膳而敷之三四五一壽搗慶蜣良螂膳以醯封而炙之蟲環出三四六一取慶蜣良螂一斗去其甲足以烏豙喙五果顆礜大如李並以酨鬥煮之汔以敷之三四七一大皮桐以蓋而約之善三四八一燔牡鼠矢治以善酨膳而封之三四九一燔礜治烏豙喙黎藜盧蜀椒菽庶蜀椒桂各一合並和以頭脂布炙以尉卷倦而休三五一以小童弱溺漬陵菱敊芰以瓦器盛以布蓋置突上五六日敷之三五一一治莁夷荑苦瓠瓣並以彘職肢膏辨敷之以布裹而約之三五二一治烏豙喙四果顆陵菱敊芰一升半以南男潼童弱溺一斗半並煮熟米一升入中撓以敷之三五三一治烏豙喙炙羖脂辨熱敷之三五四一取陳葵莖燔治之以彘職肢膏淆辨以敷痏三五五一濡加痂治巫莁夷荑半參以肥滿剡獖膏夷善以水灑加痂干而敷之以三五六布約之死人胻骨燔而治之以識肢膏三五七一産痂先善以水灑而炙蛇膏令消敷三敷三五八一痂方取三歲織肢豬膏敷之燔胕腐荊箕取其灰三巳令三五九一干加痂治蛇床實以牡彘膏膳先括刮加痂潰即敷而干去目三六一以水銀谷汁和而敷之先以曶修滫敷三六一一加痂方財治犁藜盧以蜂蜂駘辨和之即孰加痂而己嘗試毋禁三六二蛇齧以桑汁塗塗之三六三癰取羽二二禹步三一咅杯三六四一癰自發者取桐本一節所以澤釋泔煮三六五一癰種腫者取烏豙喙黎藜盧治之之以尉種腫所有可三六六手令癰種腫者皆已三六七一癰首取茈半鬥細酋刀𠟃而以善酨六斗如此醫以此教惠三六八一身有癰者自睪擇取大山陵某幸病癰我直值百疾之我以明月炻若寒三六九以柞木食桯若以虎蚤抉取若刀而割若葦而刖若肉若不去苦唾唾三七朝日未鄉向唾唾之三七一一白茝白衡菌桂枯疆薑薪新雉凡五物等已治五物取牛脂細布三七二並以金銚煏桑炭毚才岪沸發高手歊有又復煏岪沸如此布抒取汁即取水三七三銀靡磨掌中以和藥敷旦以濡漿細之敷藥毋食三七四彘肉魚及女子已面類者三七五一身有體癰種腫者方取牡一誇就炊之候其洎不盡三七六一斗抒臧藏之稍取以塗身體體種腫者而炙之癰種腫盡去已嘗試令三七七一頤癰者治半夏一牛煎脂二醯六並以鼎如𤻎以敷勿盡敷圓一寸三七八干復敷之而以湯灑去藥已矣三七九鬃唾曰噴漆漆三即曰天啻帝下若以漆漆弓矢今若為下民疕塗塗若以豕矢以履下靡磨抵之三八一祝曰啻帝右有五兵璽爾亡不亡瀉刀為裝即唾之男子七女子二七三八一一噴漆漆王若不能漆漆甲兵令某傷奚雞矢鼠襄壞塗塗漆漆王三八二一鼠𫋂腕飲其一咅杯令人終身不髹三八三一敷之三八四一三八五以朝未食時敷三八六病已如故治病毋時治病禁勿三八七一以木薪炊五斗米孰熟之即三八八時取狼牙根三八九蟲蝕在於𦞈喉若在它所其病所在曰核核毀而取三九而以灑之令僕僕然即以敷敷湯以羽靡磨三九一即敷藥敷藥薄厚盈空孔而止明日有又灑以湯三九二敷藥如前日一灑日一敷藥三數肉産傷三九三肉而止止即灑去藥已去藥即以彘疕瘳而止三九四三日而肉産可八九日而傷平傷平十餘日而瘳如故傷三九五欲裹之則裹之欲勿矣敷藥先旦未敷三九六敷藥欲食即食服藥時三九七一燔屚漏𥶌蘆治之以杜牡豬膏三九八一取雄雞矢燔以熏其痏鼠令自死煮以水三九九布其汁中敷之毋以手操痏四一蟲蝕取禹灶塞傷痏令四一一貮蟘食蝕口鼻治堇頁堇葵以桑薪燔其令汁出以羽取四二一豦遽斬乘車髹槨四三一食蝕以豬肉肥者四四以四五一治陳葵以四六一貮蟘食蝕齒以榆皮白美桂而並敷空孔四七干騷瘙方以雄黃二兩水銀兩少半頭脂一升雄黃靡磨水銀手四八雄黃孰撓之先孰灑騷瘙以湯潰其灌撫以布令而敷之一夜一四九一熬陵菱豉芰一參令黃以淳酒半鬥煮之三沸止蚩其汁夕毋食飲四一一以般服零最撮取大者一枚壽搗壽搗之以春正舂脂辨之以為大丸操四一一一取茹盧蘆本嗢之以酒漬之後日一夜而以塗塗之已四一二一取犁藜盧二齊烏豙喙一齊礜一齊屈居據齊蕪華花一齊並和以車故脂如四一三裹善灑干節即炙裹樂藥以靡磨其騷瘙靡磨脂脂騷瘙即已四一四一取闌蘭根白付小刌一升舂之以酨沐相半洎之毚才置溫所三日而入豬膏四一五者一合其中因炊三沸以敷疥而炙之干而復敷者居二日乃浴疥已令四一六一煮桃葉三皯以為湯之溫內飲熱酒已即入湯中有又飲熱酒其中雖久騷瘙已四一七一干騷瘙煮弱溺二斗令二升豕膏一升治黎藜戶二升同敷之四一八身疕疕毋名而養癢用陵菱叔敊芰熬治之以犬膽和以敷之敷之久者輒停三日三疕已嘗試令四一九一疕嗢葵漬以水夏日勿漬以敷之百疕盡已四二一黎藜盧二礜一豕膏和而㙭以尉疕四二一一久疕不已干誇刳灶漬以敷之已四二二一行山中而疕出其身如牛目是胃謂日四二三一露疕燔飯焦治以久膏和敷四二四一四二五一以槐東鄉向本枝葉三皯煮以汁四二六一其祝曰浸㽱浸㽱蟲黃神在灶中遠黃神興四二七一涿瘃先以黍潘孰灑涿瘃即燔數年陳藁其灰治敷涿瘃已敷灰灰盡漬四二八摹以捚去之已捚輒復敷灰捚如前雖久涿瘃汁盡即可瘳矣敷藥時禁四二九嘗試令四三一蒸蒸凍土以尉之四三一一以兔産礦腦塗之四三二一咀韰薤以封之四三三一踐而涿瘃者燔地穿而入足如食頃而已即蔥封之若蒸蒸蔥尉之四三四蠱者燔扁蝙輻蝠以荊薪即以食邪者四三五一燔女子布以飲四三六蠱而病者燔北鄉向並符而蒸蒸羊尼㞓以下湯敦淳符灰即病者沐浴為蠱者四三七一病蠱者以烏雄雞一蛇一並直置瓦赤鋪釜中即蓋以東鄉向灶炊之令雞蛇四三八盡燋即出而治之令病者每旦以三指三最撮藥入一杯杯酒若鬻粥中而飲之日一飲四三九盡藥已四四一蠱漬女子未嘗丈夫者布咅杯治桂入中令毋臭而以飲之四四一魃禹步三取桃東枳枝中別為之倡而筓門戶上各一四四二一祝曰濆者魃父鬾母毋匿北巫婦求若固得若四肨體編若十指投若四四三水人殹也人殹也而比鬼每行以採蠡為車以敝箕為輿乘人黑豬行人室家四四四若徹莎鬾鬾所四四五去人馬疣方取段鍛鐵者灰三四四六以蒒煮安炊之勿令疾沸不盡可一升以金四四七去復再三敷其處而已嘗試毋禁令四四八一去人馬疣疣其末大本小者取夾白柎繩之以堅潔手結四四九疣去矣毋禁毋禁嘗試令四五治㾺㾺者癰痛而潰㾺居右馬右頰骨左馬左頰骨燔治之豚煮叔菽取汁灑四五一以彘膏已湔煎者膏之而以治馬頰骨敷布膏更裹再膏敷四五二而灑以叔菽汁草日㾺己嘗試令四五三一㾺㾺者有牝牡牡高膚牝有空孔治以丹為一合撓之以豬織肢四五四膏和敷之有去者輒逋之勿灑面靤赤已四五五一㾺㾺者癰而潰用良叔菽雷矢各而蟷搗之以敷癰空孔四五六中敷藥必先灑之日一灑敷藥敷藥六十日㾺四五七筮噬取莓莖暴曝干之四五八毋已飲此得臥臥臼爻一八目覺更得已解弱溺四五九干莓用之四六根干之剡取皮採根四六一十斗以美四六二
